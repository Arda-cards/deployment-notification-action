---
name: 'Deploy Slack Notify Announce'
description: >-
  Post a standalone Slack announcement for the final deployment.
  All failures are non-fatal.

inputs:
  context:
    description: 'JSON context from the post action, including the tracked purposes and version'
    required: true
  slack-bot-token:
    description: 'Slack bot token with chat:write (empty = notifier no-ops)'
    required: false
    default: ''
  slack-channel:
    description: 'Slack announcement destination. An empty value skips the announcement and emits a workflow notice.'
    required: false
    default: ''
  github-token:
    description: >-
      Token with contents:read, pull-requests:read, actions:read, and deployments:read
      to look up release notes, changes, and deploy history.
    required: true

runs:
  using: 'node24'
  main: 'index.js'
