---
name: 'Deploy Slack Notify Update'
description: 'Update an existing Slack deployment message. All failures are non-fatal.'

inputs:
  context:
    description: 'JSON context from the post action, including the message IDs and deployment settings'
    required: true
  purpose:
    description: 'Tracked deployment purpose that the status hint applies to'
    required: false
    default: ''
  status:
    description: 'Status hint for the specified purpose (a job result, or in_progress/pending)'
    required: false
    default: 'pending'
  slack-bot-token:
    description: 'Slack bot token with chat:write (empty = notifier no-ops)'
    required: false
    default: ''
  github-token:
    description: >-
      Token with contents:read for release notes, pull-requests:read for PR lookup,
      and actions:read and deployments:read for job status and deploy history.
    required: true

runs:
  using: 'node24'
  main: 'index.js'
