---
name: 'Deploy Slack Notify Update'
description: >-
  Update an existing Slack deployment message or post an announcement for
  the final deployment. All failures are non-fatal.

inputs:
  mode:
    description: 'Use update to edit the status message or announce to post a standalone announcement'
    required: false
    default: 'update'
  commit-sha:
    description: 'Commit being deployed; used to find the source PR and author'
    required: false
    default: ''
  version:
    description: 'Deployment version to display after the repository name in Slack'
    required: false
    default: ''
  tracked-purpose:
    description: 'Comma-separated purposes in deployment order. The last purpose sets the deployment baseline.'
    required: false
    default: 'dev, stage, demo, prod'
  jobNamePattern:
    description: 'Job name template for live status lookup. $purpose is replaced with the tracked purpose name.'
    required: false
    default: 'deploy ($purpose)'
  purpose:
    description: 'Tracked deployment purpose that the status hint applies to in update mode'
    required: false
    default: ''
  status:
    description: 'Status hint for the specified purpose (a job result, or in_progress/pending) in update mode'
    required: false
    default: 'pending'
  message-ts:
    description: 'Slack message ts returned by the post action, used in update mode'
    required: false
    default: ''
  channel-id:
    description: 'Slack channel id returned by the post action, used in update mode'
    required: false
    default: ''
  slack-bot-token:
    description: 'Slack bot token with chat:write (empty = notifier no-ops)'
    required: false
    default: ''
  slack-channel:
    description: 'Slack channel id/name (empty = notifier no-ops). In announce mode, the channel to post to.'
    required: false
    default: ''
  github-token:
    description: >-
      Token with pull-requests:read (PR/author lookup) and actions:read (this
      run's jobs + pending approvals, and the deploy history behind the
      change list)
    required: true
  user-map-path:
    description: 'Path to the GitHub-login -> Slack-id map, relative to the repo root'
    required: false
    default: '.github/deploy-notify/user-map.json'

runs:
  using: 'node24'
  main: 'index.js'
