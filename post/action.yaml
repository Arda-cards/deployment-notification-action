---
name: 'Deploy Slack Notify Post'
description: >-
  Post a Slack message to track a commit through its deployment purposes.
  All failures are non-fatal.

inputs:
  commit-sha:
    description: 'Commit being deployed; used to find the source PR and author'
    required: false
    default: ''
  version:
    description: 'Deployment version to display after the repository name in Slack'
    required: false
    default: ''
  tracked-purpose:
    description: 'Comma-separated purposes in deployment order. The last purpose sets the deployment baseline.'
    required: false
    default: 'dev, stage, demo, prod'
  jobNamePattern:
    description: 'Job name template for live status lookup. $purpose is replaced with the tracked purpose name.'
    required: false
    default: 'deploy ($purpose)'
  purpose:
    description: 'Tracked deployment purpose that the status hint applies to'
    required: false
    default: ''
  status:
    description: 'Status hint for the specified purpose (a job result, or in_progress/pending)'
    required: false
    default: 'pending'
  slack-bot-token:
    description: 'Slack bot token with chat:write (empty = notifier no-ops)'
    required: false
    default: ''
  slack-channel:
    description: 'Slack channel id/name to post to (empty = notifier no-ops)'
    required: false
    default: ''
  github-token:
    description: >-
      Token with pull-requests:read (PR/author lookup) and actions:read (this
      run's jobs + pending approvals, and the deploy history behind the
      change list)
    required: true
  user-map-path:
    description: 'Path to the GitHub-login -> Slack-id map, relative to the repo root'
    required: false
    default: '.github/deploy-notify/user-map.json'

outputs:
  context:
    description: 'JSON with channel_id, message_ts, and the ordered tracked_purposes array'

runs:
  using: 'node24'
  main: 'index.js'
